<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('객실 조회')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container">
    <h1>객실 조회</h1>
    <p class="subtitle">기간을 선택하면 해당 기간에 예약 가능한 객실만 보여줍니다.</p>

    <div th:replace="~{fragments :: alerts}"></div>

    <form class="card search-form" method="get" th:action="@{/rooms}">
        <div class="field">
            <label>체크인</label>
            <input type="date" name="checkIn" th:value="${checkIn}" required/>
        </div>
        <div class="field">
            <label>체크아웃</label>
            <input type="date" name="checkOut" th:value="${checkOut}" required/>
        </div>
        <button type="submit" class="btn">조회</button>
        <a th:href="@{/rooms}" class="btn btn-ghost">전체 객실</a>
    </form>

    <h2 th:text="${searched} ? '예약 가능 객실' : '전체 객실'">객실</h2>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>객실번호</th>
                <th>타입</th>
                <th>정원</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(rooms)}">
                <td colspan="4" class="empty">
                    <span th:text="${searched} ? '선택하신 기간에 예약 가능한 객실이 없습니다.' : '등록된 객실이 없습니다.'"></span>
                </td>
            </tr>
            <tr th:each="room : ${rooms}">
                <td th:text="${room.roomNumber}">101</td>
                <td>
                    <span class="badge" th:text="${room.type.displayName}">싱글</span>
                </td>
                <td th:text="${room.capacity} + '인'">2인</td>
                <td class="right">
                    <a class="btn btn-sm"
                       th:href="${searched}
                         ? @{/reservations/new(roomId=${room.id}, checkIn=${checkIn}, checkOut=${checkOut})}
                         : @{/reservations/new(roomId=${room.id})}">
                        예약하기
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
