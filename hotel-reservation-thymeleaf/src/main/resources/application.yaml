spring:
  application:
    name: hotel-reservation-thymeleaf

  # H2 인메모리 데이터베이스
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # Thymeleaf (개발 중 캐시 비활성화)
  thymeleaf:
    cache: false

  # H2 콘솔 (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true

server:
  port: 8080
