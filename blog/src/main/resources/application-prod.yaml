# 운영(AWS Elastic Beanstalk + RDS) 전용 설정.
# EB 환경 속성에 SPRING_PROFILES_ACTIVE=prod 를 설정하면 이 파일이 적용됩니다.
# RDS를 EB 환경에 연결(attach)하면 아래 RDS_* 환경변수가 EB에 의해 자동 주입됩니다.
spring:
  datasource:
    url: jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 운영에서는 스키마를 지우지 않도록 update 사용 (create-drop 금지)
      ddl-auto: update
    show-sql: false

  # data.sql은 임베디드(H2) 전용 초기화였으므로 운영(RDS)에서는 실행하지 않음
  sql:
    init:
      mode: never

  # 운영에서는 H2 콘솔 비활성화
  h2:
    console:
      enabled: false
