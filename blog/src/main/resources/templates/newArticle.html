<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>블로그 글</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
    <div class="p-5 mb-5 text-center bg-light">
        <h1 class="mb-3">My Blog</h1>
        <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-8">
                <article>
                    <!-- 아이디 정보 저장 -->
                    <input type="hidden" id="article-id" th:value="${article.id}">
                    <header class="mb-4">
                        <input type="text" class="form-control" placeholder="제목" id="title"
                               th:value="${article.title}">
                    </header>
                    <section class="mb-4">
                        <label for="image-upload" class="form-label">이미지 업로드</label>
                        <div class="input-group mb-2">
                            <input type="file" class="form-control" id="image-upload"
                                accept="image/*">
                        </div>
                        <input type="hidden" id="image-url" th:value="${article.imageUrl}">
                        <div id="image-preview" class="mt-3" style="display: none;">
                            <img src="" alt="미리보기" id="preview-img" style="max-width: 100%;
                                    max-height: 400px;">
                            <button id="remove-image-btn"
                                    class="btn btn-sm btn-danger mt-2">이미지 제거</button>
                        </div>
                    </section>
                    <section class="mb-5">
                        <textarea class="form-control h-25" rows="10" placeholder="내용"
                                  id="content" th:text="${article.content}"></textarea>
                    </section>
                    <button type="button" id="ai-assist-btn"
                            class="btn btn-info btn-sm">AI 도움받기</button>
                    <button th:if="${article.id} != null" id="modify-btn"
                            class="btn btn-primary btn-sm">수정</button>
                    <button th:if="${article.id} == null" id="create-btn"
                            class="btn btn-primary btn-sm">등록</button>
                </article>
            </div>
        </div>
    </div>

    <!-- AI 글쓰기 도우미 모달 (Bootstrap 5) -->
    <div class="modal fade" id="aiAssistModal" tabindex="-1"
         aria-labelledby="aiAssistModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aiAssistModalLabel">AI 글쓰기 도우미</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="ai-question" class="form-label">어떤 부분이 고민되시나요?</label>
                        <textarea class="form-control" id="ai-question" rows="3"
                                  placeholder="예: 이 다음에 어떤 내용을 써야 할까요?"></textarea>
                    </div>
                    <button type="button" id="get-suggestion-btn" class="btn btn-primary">제안 받기</button>

                    <div id="ai-loading" class="mt-3" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <span class="ms-2">AI가 생각하고 있습니다...</span>
                    </div>

                    <!-- 받은 제안이 표시되는 영역 (제안을 클릭하면 본문에 추가됨) -->
                    <div id="ai-suggestion" class="mt-3" style="display: none;">
                        <h6>AI 제안 <small class="text-muted">(클릭하면 본문에 추가됩니다)</small></h6>
                        <div id="ai-suggestion-content"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 부트스트랩 5 JS 번들 (모달 동작에 필수) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/article.js"></script>
</body>
</html>
