# ===== 서버 =====
server.port=8080
spring.application.name=bank-server

# 한글 응답 인코딩
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===== H2 메모리 데이터베이스 (설치 불필요, 바로 실행) =====
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== H2 웹 콘솔 =====
# 브라우저에서 http://localhost:8080/h2-console 접속
#   JDBC URL: jdbc:h2:mem:bankdb   /   사용자명: sa   /   비밀번호: (빈칸)
spring.h2.console.enabled=true
